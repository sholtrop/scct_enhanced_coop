version: '3.8'

services:
  scct_coop_server:
    build:
      context: ..
      dockerfile: scct_coop_server/Dockerfile
    container_name: scct_coop_server
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "8080:8080/tcp"
    environment:
      - RUST_LOG=info
      - STUN_PORT=3478
      - HTTP_PORT=8080
