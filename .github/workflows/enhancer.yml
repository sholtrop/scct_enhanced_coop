name: Build & Release Enhancer

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'scct_coop_enhancer/**'
      - 'images/scct_ec_logo.png'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/enhancer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      asset_name: ${{ steps.get_version.outputs.ASSET_NAME }}
    env:
      RUST_TARGET: x86_64-pc-windows-msvc

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract semver from Cargo.toml
        id: get_version
        shell: bash
        run: |
          if [ -f "scct_coop_enhancer/Cargo.toml" ]; then
            ENHANCER_CARGO="scct_coop_enhancer/Cargo.toml"
          else
            ENHANCER_CARGO="public/scct_coop_enhancer/Cargo.toml"
          fi
          VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*["'"'"']\([^"'"'"']*\)["'"'"'].*/\1/p' "$ENHANCER_CARGO" | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Failed to extract version from $ENHANCER_CARGO"
            exit 1
          fi
          ASSET_NAME="scct_coop_enhancer-${VERSION}.exe"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Release asset will be: $ASSET_NAME (tag: $VERSION)"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ env.RUST_TARGET }}

      - name: Build release binary
        shell: bash
        run: |
          if [ -f "Cargo.toml" ]; then
            CARGO_PATH="Cargo.toml"
          else
            CARGO_PATH="public/Cargo.toml"
          fi
          cargo build --release --target "${{ env.RUST_TARGET }}" --manifest-path "$CARGO_PATH" -p scct_coop_enhancer

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release_assets

          if [ -d "target/${{ env.RUST_TARGET }}/release" ]; then
            TARGET_DIR="target/${{ env.RUST_TARGET }}/release"
          elif [ -d "public/target/${{ env.RUST_TARGET }}/release" ]; then
            TARGET_DIR="public/target/${{ env.RUST_TARGET }}/release"
          else
            TARGET_DIR="target/release"
          fi

          SRC="$TARGET_DIR/scct_coop_enhancer.exe"
          cp "$SRC" "release_assets/${{ steps.get_version.outputs.ASSET_NAME }}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.get_version.outputs.ASSET_NAME }}
          path: release_assets/${{ steps.get_version.outputs.ASSET_NAME }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release_assets
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: Release ${{ needs.build.outputs.version }}
          draft: false
          prerelease: false
          files: release_assets/*
          body: |
            ### Splinter Cell: Chaos Theory — Coop Mod & Launcher v${{ needs.build.outputs.version }}
            Automated release build for Splinter Cell: Chaos Theory Coop Mod & Online Launcher.

            #### Downloads:
            - **Windows**: `${{ needs.build.outputs.asset_name }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

